<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#050508" />
  <title>Jarvis</title>
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div id="app">

    <!-- Header -->
    <header id="header">
      <div class="header-left">
        <span id="status-dot" class="status-dot"></span>
        <span class="app-title">JARVIS</span>
      </div>
      <div class="header-right">
        <button id="voice-toggle-btn" class="icon-btn" title="Toggle voice output">
          <svg id="voice-on-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
          </svg>
          <svg id="voice-off-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <line x1="23" y1="9" x2="17" y2="15"/>
            <line x1="17" y1="9" x2="23" y2="15"/>
          </svg>
        </button>
        <button id="clear-btn" class="icon-btn" title="New conversation">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="1 4 1 10 7 10"/>
            <path d="M3.51 15a9 9 0 1 0 .49-3.51"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Messages -->
    <main id="messages-container">
      <div id="messages"></div>

      <div id="welcome" class="welcome">
        <div class="welcome-orb">
          <div class="orb-ring orb-ring-1"></div>
          <div class="orb-ring orb-ring-2"></div>
          <div class="orb-core"></div>
        </div>
        <h1 class="welcome-title">Jarvis</h1>
        <p class="welcome-subtitle">Your dedicated AI assistant</p>
        <p class="welcome-hint">Tap the mic or type below to begin</p>
      </div>
    </main>

    <!-- Input -->
    <footer id="input-area">
      <button id="mic-btn" class="mic-btn" title="Voice input">
        <svg id="mic-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="9" y="2" width="6" height="12" rx="3"/>
          <path d="M5 10a7 7 0 0 0 14 0"/>
          <line x1="12" y1="19" x2="12" y2="22"/>
          <line x1="8" y1="22" x2="16" y2="22"/>
        </svg>
        <svg id="stop-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="display:none">
          <rect x="6" y="6" width="12" height="12" rx="2"/>
        </svg>
      </button>

      <div class="input-wrapper">
        <textarea
          id="message-input"
          placeholder="Message Jarvis…"
          rows="1"
          autocomplete="off"
          autocorrect="on"
          spellcheck="true"
        ></textarea>
      </div>

      <button id="send-btn" class="send-btn" disabled title="Send">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </footer>
  </div>

  <!-- Voice overlay -->
  <div id="voice-overlay" class="voice-overlay hidden">
    <div class="voice-modal">
      <div class="voice-waves">
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
      </div>
      <p id="interim-text" class="interim-text">Listening…</p>
      <button id="cancel-voice-btn" class="cancel-voice-btn">Cancel</button>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
